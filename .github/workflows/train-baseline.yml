name: Train MeronChecker baseline

on:
  push:
    paths:
      - "training/**"
      - "requirements.txt"
      - ".github/workflows/train-baseline.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: meronchecker-training
  cancel-in-progress: true

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Train and evaluate
        run: python training/train.py
      - name: Save model and evaluation report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/
          git diff --cached --quiet || git commit -m "Train MeronChecker baseline model"
          git push
